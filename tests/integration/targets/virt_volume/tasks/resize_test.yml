---
# One iteration of the "volume resize" test, parameterized by
# resize_test_unit (see the loop in main.yml). Exercises both the
# pre-existing decimal-irrelevant single-letter path (unit: M) and the
# IEC long-form path (unit: GiB) that community.libvirt's _get_volume_size()
# used to mis-parse (see changelogs/fragments for the bugfix).
- name: Create volume (volume_initial_size, unit={{ resize_test_unit }})
  community.libvirt.virt_volume:
    pool: "{{ pool_name }}"
    state: present
    xml: '{{ lookup("template", "volume_definition.xml.j2") }}'
  vars:
    v__volume: "{{ volume_name }}"
    size: "{{ volume_initial_size }}"
    unit: "{{ resize_test_unit }}"

- name: Create on existing volume with the same size (volume_initial_size, unit={{ resize_test_unit }})
  community.libvirt.virt_volume:
    pool: "{{ pool_name }}"
    state: present
    xml: '{{ lookup("template", "volume_definition.xml.j2") }}'
  vars:
    v__volume: "{{ volume_name }}"
    size: "{{ volume_initial_size }}"
    unit: "{{ resize_test_unit }}"
  register: r__virt_volume__create

- name: Resize existing volume (volume_new_size, unit={{ resize_test_unit }})
  community.libvirt.virt_volume:
    pool: "{{ pool_name }}"
    state: present
    xml: '{{ lookup("template", "volume_definition.xml.j2") }}'
  vars:
    v__volume: "{{ volume_name }}"
    size: "{{ volume_new_size }}"
    unit: "{{ resize_test_unit }}"
  register: r__virt_volume__resize

- name: get_xml for volume (unit={{ resize_test_unit }})
  community.libvirt.virt_volume:
    pool: "{{ pool_name }}"
    command: get_xml
    name: "{{ volume_name }}"
  register: r__virt_volume__get_xml

- name: Assert (unit={{ resize_test_unit }})
  vars:
    unit_multiplier:
      bytes: 1
      b: 1
      k: 1024
      kib: 1024
      m: 1048576
      mib: 1048576
      g: 1073741824
      gib: 1073741824
      t: 1099511627776
      tib: 1099511627776
    new_size_bytes: "{{ volume_new_size * unit_multiplier[resize_test_unit | lower] }}"
    capacity: "<capacity unit='bytes'>{{ new_size_bytes }}</capacity>"
  ansible.builtin.assert:
    that:
      - not r__virt_volume__create.changed
      - r__virt_volume__resize.changed
      - capacity in r__virt_volume__get_xml.get_xml

- name: Delete volume (using state=absent, unit={{ resize_test_unit }})
  community.libvirt.virt_volume:
    pool: "{{ pool_name }}"
    state: absent
    name: "{{ volume_name }}"
