bugfixes:
  - virt_volume - fixed capacity/allocation unit parsing to recognize
    all unit strings documented by libvirt's storage volume XML format
    (e.g. GiB, MiB, KB, TB), instead of silently treating unrecognized
    units as a multiplier of 1 and attempting a bogus resize
    (https://github.com/ansible-collections/community.libvirt/issues/281).
